name: CI

on:
  push:
    branches:
      - main
      - develop
      - chore/release-baseline
  # Run on every pull request regardless of base branch so stacked review
  # branches (e.g. test/* → fix/*) are validated too.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint • Typecheck • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 matches local verification, Docker production image, and engines.
          node-version: 22
          cache: npm

      # Deterministic, reproducible install from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      # The following steps are all mandatory: a failure in any of them fails
      # CI. There is no longer any logic that skips tests when the script is
      # "absent" — the test scripts exist and must run.
      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit, API and component tests
        run: npm test

      # Coverage is generated as a NON-BLOCKING, informational step. It is not a
      # gate yet because coverage is intentionally scoped to core logic only
      # (see docs/testing-strategy.md). `continue-on-error` keeps a low coverage
      # number from failing CI while still surfacing the report in the log.
      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true

      # Production build must succeed. This uses the real deployment
      # configuration (output: 'standalone'); no Mapbox token is required to
      # compile (the map degrades gracefully to a configuration notice).
      - name: Production build
        run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run browser tests once the primary validation job has passed.
    needs: validate

    env:
      # Use Playwright's bundled Chromium in CI (the browser CDN is reachable
      # here) instead of the OS Chrome channel used locally.
      PLAYWRIGHT_CHANNEL: chromium
      # Build a warning-free server that `next start` fully supports. This does
      # NOT change the production/Docker build, which keeps output: 'standalone'.
      NEXT_DISABLE_STANDALONE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Install only the Chromium browser plus its OS dependencies. Firefox and
      # WebKit are intentionally not installed in this phase.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Build the production-compatible server the local E2E config expects.
      # No real Mapbox token is provided; the deterministic mocks intercept all
      # /api/* calls and the map degrades to a visible configuration notice.
      - name: Build application (test server)
        run: npm run build

      - name: Run Playwright tests
        run: npm run test:e2e

      # Upload the HTML report / traces / screenshots only when something fails.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to AWS (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy only after both quality gates pass, and only on push to the
    # release baseline (never from untrusted pull_request code).
    needs: [validate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/release-baseline'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_EXPRESS_SERVICE_NAME: ${{ vars.ECS_EXPRESS_SERVICE_NAME }}
      ECS_EXPRESS_SERVICE_ARN: ${{ vars.ECS_EXPRESS_SERVICE_ARN }}
      HEALTH_CHECK_PATH: ${{ vars.HEALTH_CHECK_PATH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          # Public browser token — still treated as protected to avoid log leaks.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Disable BuildKit attestations so ECR basic scanning accepts a
          # single Docker manifest (OCI indexes are not scannable).
          docker build \
            --provenance=false \
            --sbom=false \
            --build-arg "NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}" \
            --build-arg "GIT_REVISION=${GITHUB_SHA}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE_URI}" \
            .

          docker push "${IMAGE_URI}"

          DIGEST="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image ${IMAGE_TAG} @ ${DIGEST}"

      - name: Update ECS Express Mode service
        id: deploy
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          SECRET_ARN: ${{ vars.MAPBOX_SECRET_ARN }}
        run: |
          set -euo pipefail
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE_REF="${REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"

          PRIMARY=$(jq -n \
            --arg image "$IMAGE_REF" \
            --arg secret "$SECRET_ARN" \
            '{
              image: $image,
              containerPort: 3000,
              awsLogsConfiguration: { logGroup: "/ecs/saferoute-web", logStreamPrefix: "ecs" },
              environment: [{ name: "NODE_ENV", value: "production" }],
              secrets: [{ name: "MAPBOX_ACCESS_TOKEN", valueFrom: $secret }]
            }')

          aws ecs update-express-gateway-service \
            --service-arn "${ECS_EXPRESS_SERVICE_ARN}" \
            --primary-container "${PRIMARY}" \
            --region "${AWS_REGION}"

          echo "Updated ${ECS_EXPRESS_SERVICE_NAME} to ${IMAGE_REF}"

      - name: Wait for service ACTIVE and verify health
        id: health
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            DESC="$(aws ecs describe-express-gateway-service \
              --service-arn "${ECS_EXPRESS_SERVICE_ARN}" \
              --region "${AWS_REGION}" \
              --output json)"
            STATUS="$(echo "$DESC" | jq -r '.service.status.statusCode // empty')"
            echo "Attempt ${i}: status=${STATUS}"
            if [ "$STATUS" = "ACTIVE" ]; then
              URL="$(echo "$DESC" | jq -r '
                [.service.activeConfigurations[]?.ingressPaths[]?.endpoint // empty]
                | map(select(startswith("https://")))
                | .[0] // empty
              ')"
              # Fallback: extract first *.on.aws URL from the describe payload
              if [ -z "$URL" ] || [ "$URL" = "null" ]; then
                URL="$(echo "$DESC" | grep -oE 'https://[a-zA-Z0-9._-]+\.on\.aws' | head -n1 || true)"
              fi
              if [ -z "$URL" ]; then
                echo "ACTIVE but public URL not found in describe output"
                echo "$DESC" | jq '{status: .service.status, keys: (.service|keys)}'
                exit 1
              fi
              echo "service_url=${URL}" >> "$GITHUB_OUTPUT"
              REVISION="$(echo "$DESC" | jq -r '.service.activeConfigurations[0].serviceRevisionArn // empty')"
              echo "service_revision=${REVISION}" >> "$GITHUB_OUTPUT"
              curl -fsS "${URL}${HEALTH_CHECK_PATH}" | tee /tmp/health.json
              grep -q '"status":"ok"' /tmp/health.json
              curl -fsS -o /dev/null -w "%{http_code}\n" "${URL}/" | grep -q 200
              echo "Health OK at ${URL}"
              echo "Digest ${{ steps.build.outputs.image_digest }}"
              echo "Revision ${REVISION}"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for ACTIVE"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## SafeRoute production deploy"
            echo "- Image tag: \`${{ steps.build.outputs.image_tag }}\`"
            echo "- Image digest: \`${{ steps.build.outputs.image_digest }}\`"
            echo "- Service URL: ${{ steps.health.outputs.service_url }}"
            echo "- Revision: \`${{ steps.health.outputs.service_revision }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
