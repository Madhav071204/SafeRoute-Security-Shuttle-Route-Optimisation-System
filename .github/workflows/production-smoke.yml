name: Production smoke (manual)

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: 'SafeRoute production HTTPS base URL'
        required: false
        default: 'https://sa-2cf22f7190f04affacba88ff88c8e636.ecs.ap-southeast-2.on.aws'
        type: string

permissions:
  contents: read

jobs:
  production-smoke:
    name: Production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PRODUCTION_URL: ${{ inputs.production_url }}
      PLAYWRIGHT_CHANNEL: chromium

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production health (HTTP)
        run: |
          set -euo pipefail
          curl -fsS "${PRODUCTION_URL}/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS -o /dev/null -w "%{http_code}\n" "${PRODUCTION_URL}/" | grep -q 200

      - name: Run production smoke tests
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
